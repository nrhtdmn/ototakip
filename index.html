<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Yol Defteri</title>
<style>
  :root {
    --bg: #0d1014;
    --panel: #161b22;
    --line: #262d38;
    --text: #eef1f5;
    --dim: #8b95a5;
    --accent: #ffb020;
    --bad: #ff6b5e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  .num { font-variant-numeric: tabular-nums; }

  .speed { text-align: center; padding: 18px 0 6px; }
  .speed .v { font-size: clamp(120px, 38vw, 190px); font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
